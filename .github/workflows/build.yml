name: Build RemoteLauncher EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: بناء الملف التنفيذي (بدون نافذة terminal)
        run: pyinstaller --onefile --noconsole --name RemoteLauncher --add-data "index.html;." --hidden-import pystray._win32 server.py

      - name: رفع الـ EXE كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteLauncher
          path: dist/RemoteLauncher.exe

      - name: إنشاء Release عند push لـ tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RemoteLauncher.exe
