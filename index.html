<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Remote Launcher</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #181b22; --card: #232836; --card-hover: #2c3244;
      --accent: #4f8cff; --ok: #2ecc71; --bad: #e74c3c; --text: #eef1f7; --muted: #8a93a6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif; overflow: hidden;
    }

    /* الأزرار الثابتة يسار الشاشة */
    .fixed-btn {
      position: fixed; left: 16px; z-index: 10; border: none; border-radius: 14px;
      background: var(--card); color: var(--text); font-size: 18px; font-weight: 600;
      padding: 14px 20px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }
    .fixed-btn:active { transform: scale(.96); }
    #settingsBtn { top: 16px; }
    #aiBtn { bottom: 16px; background: var(--accent); }

    main {
      height: 100%; padding: 20px 20px 20px 170px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .status-bar { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--muted); }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 8px currentColor; }
    .dot.on { background: var(--ok); }

    /* الشاشة الوسطى: أيقونات فقط */
    #grid {
      flex: 1; overflow-y: auto; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 16px; align-content: start; padding: 8px;
    }
    .tile {
      aspect-ratio: 1; border: none; border-radius: 22px; background: var(--card);
      display: flex; align-items: center; justify-content: center; padding: 18px; cursor: pointer;
      transition: transform .1s, background .15s;
    }
    .tile:active { transform: scale(.94); background: var(--card-hover); }
    .tile img { width: 64px; height: 64px; object-fit: contain; pointer-events: none; }
    .ph { width: 64px; height: 64px; border-radius: 14px; background: #343b4f; }
    .empty { grid-column: 1 / -1; color: var(--muted); font-size: 17px; text-align: center; padding: 40px 0; }

    /* نافذة الإعدادات */
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    #overlay.show { display: flex; }
    #modal {
      background: var(--panel); border-radius: 20px; width: min(760px, 100%); max-height: 100%;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .mhead { padding: 16px 20px; font-size: 20px; font-weight: 700; border-bottom: 1px solid #2a2f3d;
      display: flex; justify-content: space-between; align-items: center; }
    .mbody { padding: 16px 20px; overflow-y: auto; display: grid; gap: 14px; }
    .mfoot { padding: 14px 20px; border-top: 1px solid #2a2f3d; display: flex; gap: 10px; }
    .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333a4d;
      background: var(--bg); color: var(--text); font-size: 16px; direction: ltr;
    }
    .btn { border: none; border-radius: 12px; padding: 12px 18px; font-size: 16px; font-weight: 600;
      cursor: pointer; background: var(--card); color: var(--text); }
    .btn.primary { background: var(--accent); color: #fff; }
    .hint { font-size: 15px; color: var(--muted); }

    /* منتقي التطبيقات */
    .picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
    .pick {
      position: relative; border: 2px solid transparent; border-radius: 16px; background: var(--card);
      padding: 12px; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; cursor: pointer;
    }
    .pick.sel { border-color: var(--accent); }
    .pick img { width: 48px; height: 48px; object-fit: contain; pointer-events: none; }
    .pick .ph { width: 48px; height: 48px; }
    .pick .chk {
      position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%;
      background: #000a; display: none; align-items: center; justify-content: center; font-size: 14px;
    }
    .pick.sel .chk { display: flex; background: var(--accent); }

    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: #000c; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 16px;
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 30;
    }
    #toast.show { opacity: 1; }

    @media (max-width: 700px), (orientation: portrait) {
      main { padding: 70px 14px 90px 14px; }
    }
  </style>
</head>
<body>

  <button id="settingsBtn" class="fixed-btn">إعدادات</button>
  <button id="aiBtn" class="fixed-btn">ai</button>

  <main>
    <div class="status-bar">
      <span id="dot" class="dot"></span>
      <span id="statusText">غير متصل</span>
    </div>
    <div id="grid"></div>
  </main>

  <div id="overlay">
    <div id="modal">
      <div class="mhead">
        <span>الإعدادات</span>
        <button class="btn" id="closeBtn">إغلاق</button>
      </div>
      <div class="mbody">
        <div class="field"><label>عنوان IP للجهاز</label>
          <input id="host" autocomplete="off" placeholder="192.168.1.10"></div>
        <div class="field"><label>المنفذ</label>
          <input id="port" type="number" placeholder="8765"></div>
        <div class="field"><label>رمز الاقتران (من أيقونة البرنامج في شريط المهام)</label>
          <input id="token" autocomplete="off"></div>
        <div class="hint" id="pickHint"></div>
        <div class="picker" id="picker"></div>
      </div>
      <div class="mfoot">
        <button class="btn primary" id="saveBtn">حفظ</button>
        <button class="btn" id="reloadBtn">تحديث القائمة</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
  const DEFAULT_PORT = 8765;
  const RETRY_MS = 2000;
  const $ = id => document.getElementById(id);

  let cfg = loadCfg();                 // إعدادات الاتصال
  let pinned = loadPinned();           // null = أول مرة، وإلا مصفوفة مسارات
  let apps = [];                       // كل التطبيقات القادمة من الجهاز
  let selection = new Set();           // اختيار مؤقت داخل نافذة الإعدادات
  let ws = null, authed = false, retryTimer = null, stopRetry = false;

  // ---------------- التخزين ----------------
  function loadCfg() {
    try {
      const s = JSON.parse(localStorage.getItem('rl_cfg') || '{}');
      return { host: s.host || location.hostname, port: s.port || DEFAULT_PORT, token: s.token || '' };
    } catch (e) { return { host: location.hostname, port: DEFAULT_PORT, token: '' }; }
  }
  function saveCfgStore() { try { localStorage.setItem('rl_cfg', JSON.stringify(cfg)); } catch (e) {} }
  function loadPinned() {
    try { const v = JSON.parse(localStorage.getItem('rl_pinned')); return Array.isArray(v) ? v : null; }
    catch (e) { return null; }
  }
  function savePinned() { try { localStorage.setItem('rl_pinned', JSON.stringify(pinned)); } catch (e) {} }

  // ---------------- الحالة والرسائل ----------------
  function setStatus(text, online) {
    $('statusText').textContent = text;
    $('dot').classList.toggle('on', online);
  }
  let toastTimer = null;
  function toast(text) {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }

  // ---------------- الاتصال ----------------
  function scheduleRetry() { if (!stopRetry) retryTimer = setTimeout(connect, RETRY_MS); }

  function connect() {
    clearTimeout(retryTimer);
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    if (!cfg.token) {
      stopRetry = true;
      setStatus('أدخل رمز الاقتران من الإعدادات', false);
      return;
    }
    stopRetry = false; authed = false;
    setStatus('جارٍ الاتصال...', false);

    let sock;
    try { sock = new WebSocket(`ws://${cfg.host}:${cfg.port}`); }
    catch (e) { scheduleRetry(); return; }
    ws = sock;

    sock.onopen = () => sock.send(JSON.stringify({ type: 'auth', token: cfg.token }));
    sock.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (_) {} };
    sock.onclose = () => {
      if (ws === sock) ws = null;
      authed = false;
      if (!stopRetry) setStatus('غير متصل، جارٍ إعادة المحاولة...', false);
      scheduleRetry();
    };
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN && authed) {
      ws.send(JSON.stringify(obj));
      return true;
    }
    toast('غير متصل بالجهاز');
    return false;
  }

  function handle(m) {
    switch (m.type) {
      case 'auth_ok':
        authed = true; setStatus('متصل', true);
        send({ type: 'list_apps' });
        break;
      case 'auth_failed':
        stopRetry = true; setStatus('رمز الاقتران غير صحيح', false);
        if (ws) ws.close();
        break;
      case 'apps':
        apps = m.apps || [];
        onAppsLoaded();
        break;
      case 'launched': toast('تم تشغيل التطبيق'); break;
      case 'error': toast(m.message || 'حدث خطأ'); break;
    }
  }

  function onAppsLoaded() {
    renderGrid();
    if ($('overlay').classList.contains('show')) renderPicker();
    else if (pinned === null && apps.length) openSettings();   // أول مرة: اطلب الاختيار
  }

  // ---------------- الأيقونات ----------------
  function iconEl(app, phClass) {
    if (app.icon) {
      const img = document.createElement('img');
      img.src = 'data:image/png;base64,' + app.icon;
      img.alt = '';
      return img;
    }
    const d = document.createElement('div');
    d.className = phClass;
    return d;
  }

  // ---------------- الشاشة الوسطى ----------------
  function renderGrid() {
    const grid = $('grid');
    grid.innerHTML = '';
    if (pinned === null) {
      grid.innerHTML = '<div class="empty">اضغط "إعدادات" واختر التطبيقات اللي بدك تظهر هون</div>';
      return;
    }
    const map = new Map(apps.map(a => [a.path, a]));
    const list = pinned.map(p => map.get(p)).filter(Boolean);
    if (!list.length) {
      grid.innerHTML = '<div class="empty">لا توجد تطبيقات محددة. اضغط "إعدادات" لاختيارها</div>';
      return;
    }
    for (const a of list) {
      const b = document.createElement('button');
      b.className = 'tile';
      b.title = a.name;
      b.setAttribute('aria-label', a.name);
      b.appendChild(iconEl(a, 'ph'));
      b.onclick = () => send({ type: 'launch', path: a.path });
      grid.appendChild(b);
    }
  }

  // ---------------- نافذة الإعدادات ----------------
  function openSettings() {
    $('host').value = cfg.host;
    $('port').value = cfg.port;
    $('token').value = cfg.token;
    selection = new Set(pinned || []);
    $('pickHint').textContent = pinned === null
      ? 'أول مرة: اختر التطبيقات اللي بدك تظهر في الشاشة الوسطى'
      : 'اختر التطبيقات اللي بدك تظهر في الشاشة الوسطى';
    $('overlay').classList.add('show');
    renderPicker();
    if (authed) send({ type: 'list_apps' });
  }

  function closeSettings() { $('overlay').classList.remove('show'); }

  function renderPicker() {
    const box = $('picker');
    box.innerHTML = '';
    if (!apps.length) {
      box.innerHTML = '<div class="hint">جارٍ تحميل التطبيقات...</div>';
      return;
    }
    for (const a of apps) {
      const d = document.createElement('div');
      d.className = 'pick' + (selection.has(a.path) ? ' sel' : '');
      d.title = a.name;
      d.setAttribute('aria-label', a.name);
      const chk = document.createElement('span');
      chk.className = 'chk';
      chk.textContent = '✓';
      d.appendChild(chk);
      d.appendChild(iconEl(a, 'ph'));
      d.onclick = () => {
        if (selection.has(a.path)) selection.delete(a.path);
        else selection.add(a.path);
        d.classList.toggle('sel', selection.has(a.path));
      };
      box.appendChild(d);
    }
  }

  // ---------------- الأزرار ----------------
  $('settingsBtn').onclick = () => {
    openSettings();
    if (!authed) connect();
  };
  $('closeBtn').onclick = closeSettings;
  $('reloadBtn').onclick = () => { if (authed) send({ type: 'list_apps' }); else connect(); };
  $('aiBtn').onclick = () => window.open('https://gemini.google.com', '_blank', 'noopener');

  $('saveBtn').onclick = () => {
    cfg = {
      host: $('host').value.trim() || location.hostname,
      port: parseInt($('port').value, 10) || DEFAULT_PORT,
      token: $('token').value.trim()
    };
    saveCfgStore();
    pinned = [...selection];
    savePinned();
    renderGrid();
    closeSettings();

    if (ws) {
      const old = ws;
      ws = null;
      old.onclose = null;
      old.close();
    }
    connect();
  };

  // ---------------- التهيئة ----------------
  renderGrid();
  if (cfg.token) connect();
  else openSettings();
</script>
</body>
</html>
